<!doctype html>
<html lang="en">
	<head>
		<meta charset="UTF-8" />
		<link rel="icon" type="image/svg+xml" href="/agentscope.svg" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>AgentScope</title>
		<script>
			// Honor the user's saved theme before first paint. Default to dark.
			let theme = 'dark';
			try {
				theme = localStorage.getItem('agentscope-theme') === 'light' ? 'light' : 'dark';
			} catch {
				// Storage may be unavailable; still start in dark mode.
			}
			document.documentElement.classList.toggle('dark', theme === 'dark');
			document.documentElement.style.colorScheme = theme;
		</script>
	</head>
	<body>
		<div id="root"></div>
		<script type="module" src="/src/main.tsx"></script>
	</body>
</html>
